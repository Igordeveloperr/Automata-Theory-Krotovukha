<polygon points="1080.00,455.00 1070.10,459.78 1070.10,450.22" fill="#9b6341"/>
<polyline points="730,510 730,625" fill="none" stroke="#5c7470" stroke-width="3" stroke-linejoin="round"/>
<polygon points="730.00,625.00 725.22,615.10 734.78,615.10" fill="#5c7470"/>
<polyline points="730,735 730,850" fill="none" stroke="#5c7470" stroke-width="3" stroke-linejoin="round"/>
<polygon points="730.00,850.00 725.22,840.10 734.78,840.10" fill="#5c7470"/>
<polyline points="900,905 1080,905" fill="none" stroke="#9b6341" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1080.00,905.00 1070.10,909.78 1070.10,900.22" fill="#9b6341"/>
<polyline points="560,905 470,905 470,260 560,260" fill="none" stroke="#5c7470" stroke-width="3" stroke-linejoin="round"/>
