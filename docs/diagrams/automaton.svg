<polygon points="560.00,220.00 550.10,224.78 550.10,215.22" fill="#5c7470"/>
<polyline points="730,285 730,400" fill="none" stroke="#5c7470" stroke-width="3" stroke-linejoin="round"/>
<polygon points="730.00,400.00 725.22,390.10 734.78,390.10" fill="#5c7470"/>
