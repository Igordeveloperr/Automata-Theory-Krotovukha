<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1280" viewBox="0 0 1500 1280" role="img" aria-labelledby="title desc">
<title id="title">Граф управляющего автомата игры «Кротовуха»</title>
<desc id="desc">Готовность, ожидание такта, проверка поля, посадка, проверка лампы, очистка столбца, пауза и завершение. Стоп восстанавливает начальное поле.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="750" y="49" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#1d5644">КРОТОВУХА · ГРАФ АВТОМАТА</text>
<text x="750" y="91" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#60736e">Основной цикл при скорости s &gt; 0  ·  n — число кротов  ·  p — вероятность аварии, %</text>
<circle cx="35" cy="230" r="11" fill="#263b39"/>
<polyline points="46,230 90,230" fill="none" stroke="#5c7470" stroke-width="3" stroke-linejoin="round"/>
<polygon points="90.00,230.00 80.10,234.78 80.10,225.22" fill="#5c7470"/>
